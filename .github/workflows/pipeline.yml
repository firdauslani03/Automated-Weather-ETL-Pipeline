name: Daily Weather ETL

on:
  schedule:
    # Runs at minute 0 past every 3rd hour
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: pip install pandas requests sqlalchemy psycopg2-binary python-dotenv
          
      - name: Run Pipeline
        env:
          # Injects your GitHub Secret into the script securely
          DB_URL: ${{ secrets.DB_URL }}
        run: python weather_etl.py